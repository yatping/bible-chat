# QLoRA on Apple Silicon with mlx-lm. Run through `scripts/train_mlx.py -c training/configs/mlx_qlora.yaml`
# (not bare `mlx_lm.lora`), which renders prompts with Gemma 4 thinking mode off like the app does.
# Mirrors the CUDA recipe in scripts/train_qlora.py where MLX allows:
# 4-bit base (QLoRA), LoRA r=16 with alpha/r = 1, effective batch of 8,
# loss on the final assistant turn only (mask_prompt).
model: training/outputs/mlx/gemma-4-E2B-it-4bit
train: true
data: training/outputs/mlx_data
adapter_path: training/outputs/mlx/adapter
fine_tune_type: lora
num_layers: -1            # all decoder layers
lora_parameters:
  rank: 16
  scale: 1.0              # = lora_alpha / r in PEFT terms
  dropout: 0.05
mask_prompt: true
batch_size: 1
grad_accumulation_steps: 8
# `iters` counts micro-batches; the LR schedule advances once per optimizer update (iters / grad_accumulation_steps).
# Tuned on the seed dataset (see README "Training on a Mac"): lr 2e-4 overfit after ~1 epoch and over-refused;
# lr 1e-4 over ~300 iterations (≈1.3 epochs of the 237-conversation train split) kept improving validation loss.
iters: 300
learning_rate: 1.0e-4
lr_schedule:              # 37 optimizer updates: 3 warmup + 34 cosine
  name: cosine_decay
  warmup: 3
  arguments: [1.0e-4, 34, 1.0e-5]
max_seq_length: 2048
grad_checkpoint: true     # fits 16 GB unified memory
steps_per_report: 10
steps_per_eval: 50
val_batches: -1
save_every: 50
seed: 13
